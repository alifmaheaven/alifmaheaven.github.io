<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" class="absolute inset-0 w-full h-full object-cover opacity-10">
    <!-- Starry background -->
    <g fill="#34d399">
        <circle cx="120" cy="150" r="1.5" />
        <circle cx="280" cy="80" r="2" />
        <circle cx="450" cy="220" r="1" />
        <circle cx="680" cy="90" r="1.5" />
        <circle cx="890" cy="250" r="2" />
        <circle cx="1100" cy="70" r="1" />
        <circle cx="1350" cy="180" r="1.5" />
        <circle cx="100" cy="450" r="2" />
        <circle cx="350" cy="550" r="1" />
        <circle cx="580" cy="380" r="1.5" />
        <circle cx="820" cy="620" r="2" />
        <circle cx="1050" cy="480" r="1" />
        <circle cx="1280" cy="650" r="1.5" />
        <circle cx="200" cy="720" r="1" />
        <circle cx="700" cy="750" r="2" />
        <circle cx="1150" cy="780" r="1.5" />
    </g>

    <!-- Connecting lines (Constellations) -->
    <g stroke="#10b981" stroke-width="0.5" opacity="0.4">
        <path d="M 120 150 L 280 80 L 450 220 L 680 90 L 890 250 L 1100 70 L 1350 180" />
        <path d="M 100 450 L 350 550 L 580 380 L 820 620 L 1050 480 L 1280 650" />
        <path d="M 280 80 L 350 550" />
        <path d="M 680 90 L 580 380 L 890 250" />
        <path d="M 1100 70 L 1050 480 L 1350 180" />
    </g>

    <!-- Floating Data Packets -->
    <g fill="#3b82f6" opacity="0.6">
        <rect x="200" y="300" width="8" height="8" rx="2">
            <animate attributeName="y" values="300; 250; 300" dur="5s" repeatCount="indefinite"/>
        </rect>
        <rect x="750" y="150" width="12" height="12" rx="3">
            <animate attributeName="y" values="150; 200; 150" dur="7s" repeatCount="indefinite"/>
        </rect>
        <rect x="1200" y="400" width="10" height="10" rx="2">
            <animate attributeName="y" values="400; 350; 400" dur="6s" repeatCount="indefinite"/>
        </rect>
        <rect x="400" y="600" width="14" height="14" rx="3">
            <animate attributeName="y" values="600; 650; 600" dur="8s" repeatCount="indefinite"/>
        </rect>
        <rect x="950" y="550" width="8" height="8" rx="2">
            <animate attributeName="y" values="550; 500; 550" dur="4s" repeatCount="indefinite"/>
        </rect>
    </g>

    <!-- Glowing Orbs (Nodes) -->
    <g fill="#10b981" opacity="0.3">
        <circle cx="500" cy="400" r="40">
            <animate attributeName="r" values="40; 45; 40" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.3; 0.5; 0.3" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1000" cy="250" r="30">
            <animate attributeName="r" values="30; 35; 30" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.3; 0.4; 0.3" dur="5s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>